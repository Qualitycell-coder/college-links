<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة روابط الكلية الرسمية</title>
    <style>
        :root {
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --badge-cat: #eff6ff;
            --badge-cat-text: #1d4ed8;
            --badge-dept: #f1f5f9;
            --badge-dept-text: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            color: var(--primary);
            font-size: 32px;
            margin-bottom: 10px;
        }
        header p {
            color: var(--text-muted);
            font-size: 16px;
        }
        .filters-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 35px;
        }
        @media (max-width: 768px) {
            .filters-section {
                grid-template-columns: 1fr;
            }
        }
        .search-input, .filter-select {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: white;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input:focus, .filter-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.1);
        }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .link-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px -3px rgba(0,0,0,0.08);
        }
        .card-top {
            margin-bottom: 15px;
        }
        .link-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .meta-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }
        .badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }
        .badge-category {
            background-color: var(--badge-cat);
            color: var(--badge-cat-text);
        }
        .badge-department {
            background-color: var(--badge-dept);
            color: var(--badge-dept-text);
        }
        .target-audience {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .target-audience strong {
            color: var(--text-main);
        }
        .visit-btn {
            display: block;
            text-align: center;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.2s;
        }
        .visit-btn:hover {
            background-color: var(--primary-hover);
        }
        .status-message {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            font-size: 18px;
            padding: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>دليل روابط الكلية الرسمية</h1>
        <p>بوابة مركزية سريعة ومنظمة للوصول إلى كافة خدمات وأقسام الكلية</p>
    </header>

    <!-- أدوات البحث والفلترة -->
    <div class="filters-section">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن اسم الخدمة أو الرابط..." onkeyup="filterLinks()">
        <select id="deptFilter" class="filter-select" onchange="filterLinks()">
            <option value="">جميع الأقسام</option>
        </select>
    </div>

    <!-- شبكة عرض الروابط -->
    <div class="links-grid" id="linksContainer">
        <div class="status-message">جاري جلب البيانات من جدول الكلية...</div>
    </div>
</div>

<script>
    const apiUrl = "https://sheetdb.io/api/v1/7wywhx5vd94u1";
    let allLinks = [];

    async function fetchLinks() {
        try {
            let response = await fetch(apiUrl);
            allLinks = await response.json();
            populateDepartments(allLinks);
            displayLinks(allLinks);
        } catch (error) {
            document.getElementById('linksContainer').innerHTML = '<div class="status-message" style="color: #dc2626;">تعذر الاتصال بقاعدة البيانات، يرجى المحاولة لاحقاً.</div>';
        }
    }

    function populateDepartments(links) {
        const deptSelect = document.getElementById('deptFilter');
        // قراءة عمود "القسم" أو بدائله بدقة
        let departments = [...new Set(links.map(link => link.القسم || link.department || link.Department).filter(Boolean))];
        
        departments.forEach(dept => {
            let option = document.createElement('option');
            option.value = dept;
            option.textContent = dept;
            deptSelect.appendChild(option);
        });
    }

    function displayLinks(links) {
        const container = document.getElementById('linksContainer');
        container.innerHTML = "";

        if (!links || links.length === 0) {
            container.innerHTML = '<div class="status-message">لا توجد نتائج مطابقة لبحثك</div>';
            return;
        }

        links.forEach(link => {
            let card = document.createElement('div');
            card.className = 'link-card';
            
            // مطابقة الأعمدة العربية تماماً كما في جدول Google Sheets الخاص بك
            let title = link.العنوان || link.Title || link.title || "بدون عنوان";
            let url = link.الرابط || link.URL || link.url || "#";
            let category = link.الفئة || link.Category || link.category || "خدمات عامة";
            let target = link["موجه إلى"] || link.Target || link.target || "الجميع";
            let department = link.القسم || link.Department || link.department || "عام";

            card.innerHTML = `
                <div class="card-top">
                    <div class="link-title">${title}</div>
                    <div class="meta-tags">
                        <span class="badge badge-category">${category}</span>
                        <span class="badge badge-department">${department}</span>
                    </div>
                    <div class="target-audience">
                        <span>موجّه إلى:</span> <strong>${target}</strong>
                    </div>
                </div>
                <a href="${url}" target="_blank" class="visit-btn">زيارة الرابط ↗</a>
            `;
            container.appendChild(card);
        });
    }

    function filterLinks() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let selectedDept = document.getElementById('deptFilter').value.toLowerCase();

        let filtered = allLinks.filter(link => {
            let title = (link.العنوان || link.Title || link.title || "").toLowerCase();
            let category = (link.الفئة || link.Category || link.category || "").toLowerCase();
            let dept = (link.القسم || link.Department || link.department || "").toLowerCase();

            let matchesSearch = title.includes(input) || category.includes(input);
            let matchesDept = selectedDept === "" || dept === selectedDept;

            return matchesSearch && matchesDept;
        });

        displayLinks(filtered);
    }

    window.onload = fetchLinks;
</script>

</body>
</html>
