<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دليل روابط الكلية الرسمية</title>
    
    <!-- ربط ملف الـ Manifest لتفعيل خاصية Add to Home Screen كتطبيق مستقل -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- استيراد خط Cairo العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #cbd5e1;
            --shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.06), 0 2px 4px -2px rgba(30, 58, 138, 0.04);
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            /* مساحة آمنة لتفادي تداخل شريط النظام في الهواتف عند التثبيت */
            padding-top: max(15px, env(safe-area-inset-top));
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
        }
        header {
            background: #ffffff;
            padding: 20px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
            position: relative;
        }
        .logo-container {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 12px;
        }
        .college-logo {
            height: 50px;
            width: auto;
            max-width: 150px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
        }
        .header-text {
            text-align: center;
        }
        header h1 {
            color: var(--primary);
            font-size: 22px;
            font-weight: 900;
            margin: 0 0 6px 0;
            line-height: 1.3;
        }
        header p {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            margin: 0;
        }
        .search-box-wrapper {
            margin-bottom: 20px;
        }
        .search-input {
            width: 100%;
            padding: 13px 18px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 600;
            border: 2px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: #ffffff;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.12);
        }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 15px;
        }
        .link-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .link-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.08);
        }
        .link-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .info-badge-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }
        .info-pill {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            background: #f1f5f9;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }
        .info-pill span {
            min-width: 65px;
        }
        .info-pill strong {
            color: var(--text-main);
            font-weight: 700;
        }
        .visit-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }
        .visit-btn:hover {
            background-color: var(--primary-hover);
        }
        .status-msg {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
            padding: 30px;
        }

        @media (max-width: 600px) {
            header {
                padding: 15px;
            }
            .college-logo {
                height: 42px;
            }
            header h1 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <!-- شعار الكلية المحلي -->
        <div class="logo-container">
            <img src="./logo%20ar.avif" alt="شعار الكلية" class="college-logo">
        </div>
        
        <!-- عنوان الصفحة والوصف -->
        <div class="header-text">
            <h1>دليل روابط الكلية الرسمية</h1>
            <p>بوابة رقمية تفاعلية للوصول السريع إلى خدمات الكلية والأقسام</p>
        </div>
    </header>

    <!-- شريط البحث الفوري -->
    <div class="search-box-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن اسم الخدمة أو القسم..." onkeyup="filterLinks()">
    </div>

    <!-- شبكة عرض البطاقات -->
    <div class="links-grid" id="linksContainer">
        <div class="status-msg">جاري تحميل الروابط...</div>
    </div>
</div>

<script>
    const apiUrl = "https://sheetdb.io/api/v1/7wywhx5vd94u1";
    let allLinks = [];

    async function fetchLinks() {
        try {
            let response = await fetch(apiUrl);
            let data = await response.json();
            
            // ترتيب الأحدث فالأحدث تلقائياً
            allLinks = data.reverse();
            
            displayLinks(allLinks);
        } catch (error) {
            document.getElementById('linksContainer').innerHTML = '<div class="status-msg" style="color: #dc2626;">تعذر جلب البيانات، تأكد من الاتصال بالإنترنت.</div>';
        }
    }

    function displayLinks(links) {
        const container = document.getElementById('linksContainer');
        container.innerHTML = "";

        if (!links || links.length === 0) {
            container.innerHTML = '<div class="status-msg">لا توجد نتائج مطابقة لبحثك</div>';
            return;
        }

        links.forEach(link => {
            let card = document.createElement('div');
            card.className = 'link-card';
            
            let keys = Object.keys(link);
            let title = link.العنوان || link.Title || link.title || link[keys[0]] || "بدون عنوان";
            let url = link.الرابط || link.URL || link.url || link[keys[1]] || "#";
            let category = link.الفئة || link.Category || link.category || link[keys[2]] || "عامة";
            let target = link["موجه إلى"] || link.Target || link.target || link[keys[3]] || "الجميع";
            let department = link.القسم || link.Department || link.department || link[keys[4]] || "الكلية";

            if (url.includes('http')) {
                let match = url.match(/(https?:\/\/[^\s]+)/);
                if (match) url = match[0].replace(')', '');
            }

            card.innerHTML = `
                <div>
                    <div class="link-title">${title}</div>
                    <div class="info-badge-container">
                        <div class="info-pill"><span>الفئة:</span> <strong>${category}</strong></div>
                        <div class="info-pill"><span>القسم:</span> <strong>${department}</strong></div>
                        <div class="info-pill"><span>المستهدف:</span> <strong>${target}</strong></div>
                    </div>
                </div>
                <a href="${url}" target="_blank" class="visit-btn">
                    <span>زيارة الرابط</span>
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>
            `;
            container.appendChild(card);
        });
    }

    function filterLinks() {
        let input = document.getElementById('searchInput').value.toLowerCase().trim();

        let filtered = allLinks.filter(link => {
            let keys = Object.keys(link);
            let title = (link.العنوان || link.Title || link.title || link[keys[0]] || "").toLowerCase();
            let category = (link.الفئة || link.Category || link.category || link[keys[2]] || "").toLowerCase();
            let department = (link.القسم || link.Department || link.department || link[keys[4]] || "").toLowerCase();

            return title.includes(input) || category.includes(input) || department.includes(input);
        });

        displayLinks(filtered);
    }

    window.onload = fetchLinks;
</script>

</body>
</html>
