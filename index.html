<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة روابط الكلية</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --badge-bg: #e0f2fe;
            --badge-color: #0369a1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        .controls-box {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .search-box, .filter-select {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            font-size: 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            background: white;
            transition: border-color 0.3s;
        }
        .search-box:focus, .filter-select:focus {
            border-color: var(--primary-color);
        }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .link-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .link-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08);
        }
        .card-header {
            margin-bottom: 15px;
        }
        .link-title {
            font-size: 19px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 10px;
        }
        .link-meta {
            font-size: 13px;
            color: #64748b;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .badges-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-block;
            background: var(--badge-bg);
            color: var(--badge-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-dept {
            background: #f1f5f9;
            color: #475569;
        }
        .visit-btn {
            display: block;
            text-align: center;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s;
            margin-top: 15px;
        }
        .visit-btn:hover {
            background-color: #1d4ed8;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            color: #64748b;
            font-size: 16px;
            padding: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>دليل روابط الكلية</h1>
        <p>منصة مركزية منظمة لخدمات الكلية والأقسام</p>
    </header>

    <!-- شريط البحث الموحد وقائمة التصفية حسب القسم -->
    <div class="controls-box">
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن اسم الخدمة أو الرابط..." onkeyup="filterLinks()">
        <select id="deptFilter" class="filter-select" onchange="filterLinks()">
            <option value="">جميع الأقسام</option>
        </select>
    </div>

    <!-- قائمة البطاقات -->
    <div class="links-grid" id="linksContainer">
        <div class="loading">جاري جلب الروابط وتحديثها من الجدول...</div>
    </div>
</div>

<script>
    const apiUrl = "https://sheetdb.io/api/v1/7wywhx5vd94u1";
    let allLinks = [];

    async function fetchLinks() {
        try {
            let response = await fetch(apiUrl);
            allLinks = await response.json();
            populateDepartments(allLinks);
            displayLinks(allLinks);
        } catch (error) {
            document.getElementById('linksContainer').innerHTML = '<div class="loading">خطأ في الاتصال بقاعدة البيانات</div>';
        }
    }

    // تعبئة قائمة الأقسام تلقائياً بناءً على ما توفره في الجدول
    function populateDepartments(links) {
        const deptSelect = document.getElementById('deptFilter');
        let departments = [...new Set(links.map(link => link.Department || link.department).filter(Boolean))];
        
        departments.forEach(dept => {
            let option = document.createElement('option');
            option.value = dept;
            option.textContent = dept;
            deptSelect.appendChild(option);
        });
    }

    function displayLinks(links) {
        const container = document.getElementById('linksContainer');
        container.innerHTML = "";

        if (!links || links.length === 0) {
            container.innerHTML = '<div class="loading">لا توجد نتائج مطابقة لبحثك</div>';
            return;
        }

        links.forEach(link => {
            let card = document.createElement('div');
            card.className = 'link-card';
            
            // مطابقة الأعمدة بدقة مع جدول جوجل (العنوان، الرابط، الفئة، موجه إلى، القسم)
            let title = link.Title || link.title || "";
            let url = link.URL || link.url || "#";
            let category = link.Category || link.category || "عام";
            let target = link.Target || link.target || "الجميع";
            let department = link.Department || link.department || "عام";

            card.setAttribute('data-title', title.toLowerCase());
            card.setAttribute('data-dept', department.toLowerCase());
            card.setAttribute('data-category', category.toLowerCase());

            card.innerHTML = `
                <div class="card-header">
                    <div class="link-title">${title}</div>
                    <div class="link-meta">
                        <div class="badges-row">
                            <span class="badge">${category}</span>
                            <span class="badge badge-dept">القسم: ${department}</span>
                        </div>
                        <span>موجّه إلى: <strong>${target}</strong></span>
                    </div>
                </div>
                <a href="${url}" target="_blank" class="visit-btn">زيارة الرابط</a>
            `;
            container.appendChild(card);
        });
    }

    function filterLinks() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let selectedDept = document.getElementById('deptFilter').value.toLowerCase();

        let filtered = allLinks.filter(link => {
            let title = (link.Title || link.title || "").toLowerCase();
            let category = (link.Category || link.category || "").toLowerCase();
            let dept = (link.Department || link.department || "").toLowerCase();

            let matchesSearch = title.includes(input) || category.includes(input);
            let matchesDept = selectedDept === "" || dept === selectedDept;

            return matchesSearch && matchesDept;
        });

        displayLinks(filtered);
    }

    window.onload = fetchLinks;
</script>

</body>
</html>
